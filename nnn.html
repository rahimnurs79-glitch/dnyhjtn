
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Игра Змейка</title>
<style>
    body {
        background: #222;
        color: white;
        text-align: center;
        font-family: Arial;
    }

    canvas {
        background: black;
        border: 3px solid lime;
        margin-top: 15px;
    }

    button {
        padding: 10px 25px;
        background: lime;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
    }
</style>
</head>
<body>

<h1>🐍 Змейка</h1>
<h2>Очки: <span id="score">0</span></h2>

<canvas id="game" width="400" height="400"></canvas>

<br><br>
<button onclick="restart()">Начать заново</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake, food, dx, dy, score, gameOver;

function restart() {
    snake = [{x: 200, y: 200}];
    food = {x: 100, y: 100};
    dx = 20;
    dy = 0;
    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = score;
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowUp" && dy === 0) {
        dx = 0; dy = -20;
    }
    if (e.key === "ArrowDown" && dy === 0) {
        dx = 0; dy = 20;
    }
    if (e.key === "ArrowLeft" && dx === 0) {
        dx = -20; dy = 0;
    }
    if (e.key === "ArrowRight" && dx === 0) {
        dx = 20; dy = 0;
    }
});

function draw() {
    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("ИГРА ОКОНЧЕНА", 65, 190);
        return;
    }

    ctx.clearRect(0, 0, 400, 400);

    // Еда
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, 20, 20);

    // Движение змейки
    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Проверка столкновения
    if (
        head.x < 0 || head.x >= 400 ||
        head.y < 0 || head.y >= 400 ||
        snake.some(part => part.x === head.x && part.y === head.y)
    ) {
        gameOver = true;
        return;
    }

    snake.unshift(head);

    // Проверка еды
    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;

        food = {
            x: Math.floor(Math.random() * 20) * 20,
            y: Math.floor(Math.random() * 20) * 20
        };
    } else {
        snake.pop();
    }

    // Рисуем змейку
    ctx.fillStyle = "lime";

    snake.forEach(part => {
        ctx.fillRect(part.x, part.y, 18, 18);
    });
}

restart();
setInterval(draw, 150);
</script>

</body>
</html>
